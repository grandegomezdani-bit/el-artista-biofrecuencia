name: Build El Artista APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q El_Artista_Biofrequency_Android_Studio.zip -d .
          test -f ElArtistaAndroid/app/build.gradle

      - name: Build APK
        working-directory: ElArtistaAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Artista-Biofrequency-APK
          path: ElArtistaAndroid/app/build/outputs/apk/debug/app-debug.apk
